name: nishith_ride
description: Nishith - Night Ride Share App for Jamalpur. Safe, reliable rides at night.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.5.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State Management
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1

  # Navigation
  go_router: ^14.6.2

  # Backend
  supabase_flutter: ^2.8.3

  # Models & Serialization
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0

  # UI & Utilities
  google_fonts: ^6.2.1
  flutter_svg: ^2.0.16
  cached_network_image: ^3.4.1
  shimmer: ^3.0.0
  intl: ^0.19.0
  timeago: ^3.7.0

  # Location & Maps
  geolocator: ^13.0.2
  google_maps_flutter: ^2.10.0
  location: ^7.0.1

  # Forms & Validation
  reactive_forms: ^17.0.1

  # Storage & Preferences
  shared_preferences: ^2.3.4
  flutter_secure_storage: ^9.2.3

  # Network & Utils
  dio: ^5.7.0
  connectivity_plus: ^6.1.1
  url_launcher: ^6.3.1
  permission_handler: ^11.3.1

  # UI Enhancements
  flutter_animate: ^4.5.2
  gap: ^3.0.1
  iconsax: ^0.0.8

  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  build_runner: ^2.4.13
  freezed: ^2.5.7
  json_serializable: ^6.9.0
  riverpod_generator: ^2.6.3
  custom_lint: ^0.7.0
  riverpod_lint: ^2.6.3

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
    - assets/animations/
